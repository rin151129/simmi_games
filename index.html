<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="캔들 모양과 차트 흐름을 초급·중급·상급 3단계로 맞히는 주식 공부 게임">
<meta name="robots" content="noindex, nofollow">
<title>🕯️ 캔들 차트 마스터 · 3단계 퀴즈</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#070d18;
  --bg2:#0b1424;
  --card:#111c2e;
  --card2:#16233a;
  --card3:#1c2b45;
  --gold:#e0b64a;
  --gold2:#f7dc8a;
  --gold-dim:rgba(224,182,74,.22);
  --ink:#eaf0fb;
  --muted:#93a3be;
  --muted2:#6d7d97;
  --bull:#e11d48;
  --bull-soft:rgba(225,29,72,.18);
  --bear:#2563eb;
  --bear-soft:rgba(37,99,235,.18);
  --ok:#22c55e;
  --no:#f43f5e;
  --r:16px;
}
html{-webkit-text-size-adjust:100%;font-size:17px}
html.big{font-size:20px}
html[hidden]{display:none}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(900px 420px at 8% -6%, rgba(224,182,74,.10), rgba(224,182,74,0) 60%),
    radial-gradient(700px 380px at 96% 4%, rgba(37,99,235,.16), rgba(37,99,235,0) 62%),
    radial-gradient(600px 500px at 50% 108%, rgba(225,29,72,.10), rgba(225,29,72,0) 60%),
    linear-gradient(180deg,#070d18 0%,#0a1220 40%,#080f1c 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Nanum Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;
  word-break:keep-all;
  overflow-wrap:break-word;
  padding-bottom:calc(1.6rem + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none !important}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(7,13,24,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(224,182,74,.18);
  padding-top:env(safe-area-inset-top);
}
.top-in{max-width:46rem;margin:0 auto;padding:.55rem .8rem .45rem;display:flex;align-items:center;gap:.5rem}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{
  font-size:1.02rem;letter-spacing:-.02em;font-weight:900;
  background:linear-gradient(120deg,#f7dc8a,#e0b64a 45%,#c8971f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
}
.brand small{font-size:.68rem;color:var(--muted2);font-weight:700;letter-spacing:.02em}
.fsbtn{
  margin-left:auto;flex:0 0 auto;
  background:rgba(224,182,74,.10);border:1px solid var(--gold-dim);border-radius:999px;
  color:var(--gold2);font-size:.72rem;font-weight:800;padding:.35rem .6rem;min-height:2.1rem;
}
.fsbtn:active{transform:translateY(1px)}

.tabs{display:flex;gap:.35rem;max-width:46rem;margin:0 auto;padding:0 .8rem .55rem}
.tab{
  flex:1 1 0;min-width:0;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  color:var(--muted);border-radius:12px;padding:.5rem .2rem;
  font-size:.8rem;font-weight:800;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;gap:.15rem;
  transition:background .15s,border-color .15s,color .15s;
}
.tab i{font-style:normal;font-size:1rem;line-height:1}
.tab[aria-selected="true"]{
  background:linear-gradient(180deg,rgba(224,182,74,.22),rgba(224,182,74,.08));
  border-color:rgba(224,182,74,.55);color:var(--gold2);
  box-shadow:0 0 0 1px rgba(224,182,74,.12) inset;
}

/* ---------- layout ---------- */
main{max-width:46rem;margin:0 auto;padding:.7rem .8rem 0}
.screen{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r);
  box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 0 1px rgba(224,182,74,.05) inset;
}
h2.sec{
  font-size:.95rem;font-weight:900;margin:1.1rem .1rem .55rem;
  display:flex;align-items:center;gap:.4rem;color:var(--gold2);letter-spacing:-.01em;
}
h2.sec:first-child{margin-top:.2rem}
h2.sec .n{font-size:.72rem;color:var(--muted2);font-weight:700}

/* ---------- level chips ---------- */
.levels{display:flex;gap:.4rem;margin-bottom:.6rem}
.lv{
  flex:1 1 0;min-width:0;
  border-radius:13px;border:1.5px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  padding:.5rem .3rem;font-size:.82rem;font-weight:800;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:.1rem;line-height:1.15;
}
.lv span{font-size:.62rem;font-weight:700;color:var(--muted2)}
.lv[data-on="1"]{color:#0a1120}
.lv[data-on="1"] span{color:rgba(10,17,32,.66)}
.lv.b[data-on="1"]{background:linear-gradient(160deg,#4ade80,#16a34a);border-color:#4ade80}
.lv.i[data-on="1"]{background:linear-gradient(160deg,#fbbf24,#d97706);border-color:#fbbf24}
.lv.a[data-on="1"]{background:linear-gradient(160deg,#fb7185,#be123c);border-color:#fb7185}

/* ---------- quiz HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.bar{flex:1 1 auto;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#e0b64a,#f7dc8a);transition:width .3s ease}
.hud .num{font-size:.75rem;font-weight:800;color:var(--muted);white-space:nowrap}
.hud .pt{font-size:.75rem;font-weight:900;color:var(--gold2);white-space:nowrap}
.combo{
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:linear-gradient(135deg,#f7dc8a,#d9a92f);color:#0a1120;
  font-weight:900;font-size:.8rem;padding:.45rem .9rem;border-radius:999px;
  box-shadow:0 8px 24px rgba(224,182,74,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;
}
.combo.on{opacity:1;transform:translate(-50%,0)}

/* ---------- question head ---------- */
.qhead{padding:.75rem .85rem .25rem}
.qtag{
  display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.02em;
  color:#0a1120;background:linear-gradient(135deg,#f7dc8a,#d9a92f);
  border-radius:999px;padding:.12rem .55rem;margin-bottom:.4rem;
}
.qtitle{font-size:1.02rem;font-weight:900;letter-spacing:-.01em;line-height:1.42;margin:0}
.qsub{font-size:.8rem;color:var(--muted);margin:.25rem 0 0;line-height:1.5}

/* ---------- chart ---------- */
.chartwrap{
  background:linear-gradient(165deg,#0a1424,#0c1a2d 60%,#0b1728);
  border:1px solid rgba(224,182,74,.16);
  border-radius:14px;margin:.6rem .6rem 0;padding:.25rem .2rem .1rem;
  box-shadow:0 0 0 1px rgba(0,0,0,.4) inset;
}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:.5rem;padding:.1rem .75rem .55rem;font-size:.66rem;color:var(--muted2);font-weight:700}
.legend b{display:inline-flex;align-items:center;gap:.22rem;font-weight:800;color:var(--muted)}
.sw{width:.55rem;height:.55rem;border-radius:2px;display:inline-block}
.sw.bull{background:var(--bull)}
.sw.bear{background:var(--bear)}
.sw.ma{background:#e0b64a;height:2px;border-radius:2px}

/* ---------- options ---------- */
.opts{display:grid;gap:.45rem;padding:.65rem .7rem .7rem}
.opt{
  display:flex;align-items:flex-start;gap:.55rem;text-align:left;
  background:rgba(255,255,255,.035);
  border:1.5px solid rgba(255,255,255,.09);
  border-radius:13px;padding:.7rem .75rem;min-height:3rem;
  font-size:.92rem;font-weight:700;line-height:1.45;color:var(--ink);
  transition:background .15s,border-color .15s,transform .1s;
}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:0 0 auto;width:1.45rem;height:1.45rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(224,182,74,.16);color:var(--gold2);
  font-size:.74rem;font-weight:900;margin-top:.05rem;
}
.opt.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.75)}
.opt.ok .k{background:var(--ok);color:#04220f}
.opt.no{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.7)}
.opt.no .k{background:var(--no);color:#2a0510}
.opt.dim{opacity:.42}
.opt[disabled]{cursor:default}

/* ---------- explanation ---------- */
.exp{margin:.1rem .7rem .1rem;border-radius:14px;overflow:hidden;border:1px solid rgba(224,182,74,.3);
  background:linear-gradient(180deg,rgba(224,182,74,.10),rgba(224,182,74,.03));animation:fade .25s ease both}
.exp .top-line{display:flex;align-items:center;gap:.45rem;padding:.6rem .8rem .1rem}
.exp .verdict{font-size:1.35rem;font-weight:900;line-height:1}
.exp .ans{font-size:.86rem;font-weight:900;color:var(--gold2)}
.exp .body{padding:.15rem .8rem .7rem;font-size:.86rem;color:#dfe7f5;line-height:1.62}
.exp .body b{color:#fff}
.exp .keyline{
  margin:.15rem .8rem .7rem;padding:.5rem .6rem;border-radius:10px;
  background:rgba(0,0,0,.28);border-left:3px solid var(--gold);
  font-size:.8rem;color:#e9dfc0;font-weight:700;line-height:1.5;
}
.rulechip{
  display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.01em;
  color:#0a1120;background:linear-gradient(135deg,#f7dc8a,#d9a92f);
  border-radius:999px;padding:.1rem .5rem;
}
.nextbtn{
  display:block;width:calc(100% - 1.4rem);margin:.55rem .7rem .75rem;
  min-height:3.1rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#f7dc8a,#e0b64a 55%,#c8971f);
  color:#0a1120;font-size:.98rem;font-weight:900;letter-spacing:-.01em;
  box-shadow:0 8px 20px rgba(224,182,74,.25);
}
.nextbtn:active{transform:translateY(1px)}
.nextbtn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1.5px solid rgba(255,255,255,.14);box-shadow:none}

/* ---------- result ---------- */
.result{padding:1.1rem .9rem 1rem;text-align:center}
.medal{font-size:2.6rem;line-height:1}
.result h3{margin:.3rem 0 .1rem;font-size:1.25rem;font-weight:900;letter-spacing:-.02em}
.result .sub{color:var(--muted);font-size:.82rem;margin:0 0 .8rem}
.scorebox{display:flex;justify-content:center;gap:.5rem;margin:.2rem 0 .9rem}
.stat{flex:1 1 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.5rem .3rem}
.stat b{display:block;font-size:1.05rem;color:var(--gold2);font-weight:900;line-height:1.2}
.stat span{font-size:.66rem;color:var(--muted2);font-weight:700}
.wronglist{text-align:left;margin:.2rem 0 .8rem;border-top:1px solid rgba(255,255,255,.08);padding-top:.6rem}
.wronglist .h{font-size:.74rem;font-weight:900;color:var(--muted);margin-bottom:.3rem}
.wronglist li{font-size:.78rem;color:#cfd9ea;margin:.25rem 0 .25rem .1rem;list-style:none;display:flex;gap:.4rem}
.wronglist li i{font-style:normal;color:var(--no);font-weight:900;flex:0 0 auto}
.wronglist ul{margin:0;padding:0}
.btns{display:grid;gap:.45rem}
.btn{
  min-height:3rem;border-radius:13px;border:none;font-size:.94rem;font-weight:900;
  background:linear-gradient(135deg,#f7dc8a,#e0b64a 55%,#c8971f);color:#0a1120;
}
.btn.ghost{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);color:var(--ink)}
.btn:active{transform:translateY(1px)}

/* ---------- 도감 ---------- */
.patlist{display:grid;gap:.55rem}
.pat{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,var(--card2),var(--card));}
.pat .hd{display:flex;align-items:center;gap:.45rem;padding:.6rem .75rem .1rem}
.pat .no{
  flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#f7dc8a,#d9a92f);color:#0a1120;font-weight:900;font-size:.8rem;
}
.pat h4{margin:0;font-size:.9rem;font-weight:900;letter-spacing:-.01em;flex:1 1 auto;line-height:1.35}
.pat .badge{flex:0 0 auto;font-size:.64rem;font-weight:900;padding:.12rem .45rem;border-radius:999px;white-space:nowrap}
.badge.good{background:rgba(34,197,94,.18);color:#6ee7a0;border:1px solid rgba(34,197,94,.4)}
.badge.warn{background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.4)}
.badge.bad{background:rgba(244,63,94,.16);color:#fda4af;border:1px solid rgba(244,63,94,.4)}
.pat .mini{padding:.15rem .35rem 0}
.pat .mini svg{display:block;width:100%;height:auto}
.pat .tx{padding:.45rem .8rem .7rem;font-size:.8rem;color:#d5dfef;line-height:1.58}
.pat .tx b{color:var(--gold2)}
.pat .tx .say{display:block;margin-top:.35rem;font-size:.76rem;color:var(--muted)}

.filters{display:flex;gap:.35rem;flex-wrap:wrap;margin:.2rem .1rem .6rem}
.fchip{
  border-radius:999px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  color:var(--muted);font-size:.74rem;font-weight:800;padding:.35rem .7rem;min-height:2.2rem;
}
.fchip[data-on="1"]{background:rgba(224,182,74,.18);border-color:rgba(224,182,74,.5);color:var(--gold2)}
.rules{display:grid;gap:.3rem}
.rule{display:flex;gap:.55rem;padding:.55rem .65rem;border-radius:11px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.055)}
.rule .n{flex:0 0 auto;font-size:.72rem;font-weight:900;color:var(--gold);width:2.1rem;padding-top:.1rem}
.rule .c{flex:1 1 auto;min-width:0}
.rule .t{font-size:.83rem;font-weight:900;line-height:1.4;letter-spacing:-.01em}
.rule .d{font-size:.76rem;color:var(--muted);line-height:1.5;margin-top:.1rem}
.rule .lv{flex:0 0 auto;align-self:flex-start;font-size:.6rem;font-weight:900;padding:.1rem .35rem;border-radius:6px;margin-top:.15rem}
.rule .lv.b{background:rgba(74,222,128,.14);color:#86efac}
.rule .lv.i{background:rgba(251,191,36,.14);color:#fcd34d}
.rule .lv.a{background:rgba(251,113,133,.14);color:#fda4af}
.empty{font-size:.82rem;color:var(--muted);text-align:center;padding:1.4rem .8rem}

/* ---------- 기록 ---------- */
.rec{display:grid;gap:.45rem}
.recrow{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.recrow .ic{width:1.7rem;height:1.7rem;border-radius:9px;display:grid;place-items:center;font-size:.9rem;flex:0 0 auto}
.recrow .ic.b{background:rgba(74,222,128,.16)}
.recrow .ic.i{background:rgba(251,191,36,.16)}
.recrow .ic.a{background:rgba(251,113,133,.16)}
.recrow .nm{flex:1 1 auto;font-size:.85rem;font-weight:800}
.recrow .nm small{display:block;font-size:.68rem;color:var(--muted2);font-weight:700}
.recrow .sc{font-size:.9rem;font-weight:900;color:var(--gold2);white-space:nowrap}
.recrow .sc em{font-style:normal;font-size:.66rem;color:var(--muted2);font-weight:700}
.tipbox{font-size:.76rem;color:var(--muted);line-height:1.6;padding:.7rem .8rem;border-radius:12px;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.22);margin-top:.6rem}
.foot{text-align:center;font-size:.66rem;color:var(--muted2);padding:1.4rem .8rem .6rem;line-height:1.7}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- SVG 차트 ---------- */
.rv{animation:rvIn .42s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center bottom}
@keyframes rvIn{from{opacity:0;transform:translateY(6px) scale(.55)}to{opacity:1;transform:none}}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <b>🕯️ 캔들 차트 마스터</b>
      <small>차트 읽기의 규칙 · 초급·중급·상급 3단계</small>
    </div>
    <button class="fsbtn" id="fsBtn" type="button" aria-label="글자 크기 바꾸기">가+</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button class="tab" role="tab" data-tab="quiz" aria-selected="true" type="button"><i>🕯️</i>퀴즈</button>
    <button class="tab" role="tab" data-tab="book" aria-selected="false" type="button"><i>📖</i>패턴 도감</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false" type="button"><i>🏆</i>내 기록</button>
  </nav>
</header>

<main>
  <section id="view-quiz" class="screen" aria-label="퀴즈"></section>
  <section id="view-book" class="screen" aria-label="패턴 도감" hidden></section>
  <section id="view-stats" class="screen" aria-label="내 기록" hidden></section>
</main>

<div id="combo" class="combo" role="status" aria-live="polite"></div>
<div class="foot">파동마스터 《차트 읽기의 규칙 핸드북 87선》 기반 학습 게임<br>양봉 = 빨강 · 음봉 = 파랑 (한국 증시 기준) · 투자 판단의 책임은 본인에게 있습니다</div>

<script>
/* =========================================================
   캔들 차트 마스터 — 문제 · 도감 데이터
   원전: 파동마스터 《차트 읽기의 규칙 핸드북 87선》 (PART 1~8, #1~#89)
   + 텔레그램 '심미ai방'에서 다룬 「장대양봉 뒤 음봉 5가지 패턴」
   ========================================================= */
(function () {
  'use strict';

  var D = { questions: [], patterns: [], rules: [] };

  /* 공통 차트 기본값 */
  function ch(o) {
    var base = { start: 10000, unit: 100, noise: 0.42, seed: 7, ma: [5] };
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) base[k] = o[k];
    return base;
  }

  /* 자주 쓰는 캔들 모양 (unit 배수 오프셋) */
  var SHAPE = {
    bigBull: { o: 0.05, h: 1.3, l: -0.08, c: 1.2, v: 3.0 },
    bigBear: { o: 0.06, h: 0.12, l: -1.3, c: -1.2, v: 3.0 },
    smallBear: { o: 0.02, h: 0.1, l: -0.3, c: -0.22, v: 0.6 },
    smallBull: { o: 0, h: 0.5, l: -0.1, c: 0.4, v: 1.3 }
  };

  /* =========================================================
     🟢 초급 — PART 1~4 (캔들 · 거래량 · 지지저항 · 매매기초)
     ========================================================= */
  D.questions.push(
    {
      id: 'b01', level: 'beginner', tag: '초급 #1', hlBack: 0,
      title: '마지막 캔들의 이름은?',
      sub: '몸통은 결과, 꼬리는 과정. 캔들 하나에 하루의 싸움이 다 들어 있어요.',

<script>
/* =========================================================
   캔들 차트 마스터 — 엔진
   · 시리즈 생성기(seed 고정) + SVG 차트 렌더러 + 게임 UI

(function () {
  'use strict';

  var D = window.CM_DATA;

  /* ---------- utils ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    });
  }
  function num(n, d) { var p = Math.pow(10, d == null ? 2 : d); return Math.round(n * p) / p; }
  function fmt(p) { return Math.round(p).toLocaleString('en-US'); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function atPath(path, t) {
    if (!path || !path.length) return 0;
    if (path.length === 1) return path[0];
    var p = t * (path.length - 1);
    var i = Math.min(path.length - 2, Math.floor(p));
    var f = p - i;
    return path[i] * (1 - f) + path[i + 1] * f;
  }

  /* ---------- 시리즈 생성 ----------
     spec: { start, n, path[], unit, noise, gap, volBase, volPath[], seed,
             pattern:[{o,h,l,c,v}], next:[{o,h,l,c,v}] }
     o/h/l/c 는 '직전 종가 기준 unit 배수' 오프셋.  v 는 volBase 배수.
  */
  function buildSeries(spec) {
    var rnd = mulberry32(spec.seed || 3);
    var n = spec.n || 20;
    var unit = spec.unit || 100;
    var noise = spec.noise == null ? 0.30 : spec.noise;
    var volBase = spec.volBase || 100;
    var volPath = spec.volPath || [1];
    var out = [];
    var prev = spec.start;

    function gen(target, volMul, bodyScale) {
      var c = target + (rnd() - 0.5) * 2 * noise * unit;
      var o = prev + (rnd() - 0.5) * 0.20 * unit * (spec.gap == null ? 1 : spec.gap);
      var bl = Math.abs(c - o);
      var wickBase = Math.max(0.45 * bl, 0.07 * unit);
      var h = Math.max(o, c) + Math.pow(rnd(), 1.3) * wickBase;
      var l = Math.min(o, c) - Math.pow(rnd(), 1.3) * wickBase;
      var body = Math.abs(c - o) / unit;
      var v = volBase * (volMul == null ? 1 : volMul) * (0.76 + rnd() * 0.52) * (1 + Math.min(1.7, body * 0.6));
      out.push({ o: o, h: h, l: l, c: c, v: v, base: true });
      prev = c;
      return c;
    }

    if (spec.legs && spec.legs.length) {
      // 파동/추세를 구간(leg)으로 정확히 구성
      var cur = spec.start;
      for (var gi = 0; gi < spec.legs.length; gi++) {
        var leg = spec.legs[gi];
        var ln = leg.n || 2, to = leg.to;
        for (var k = 1; k <= ln; k++) {
          var tt = k / ln;
          var eased = leg.ease === false ? tt : tt * tt * (3 - 2 * tt);
          gen(cur + (to - cur) * eased, leg.vol, 1);
        }
        cur = to;
      }
    } else {
      for (var i = 0; i < n; i++) {
        var t = n > 1 ? i / (n - 1) : 0;
        gen(atPath(spec.path, t), atPath(volPath, t), 1);
      }
    }

    function add(arr) {
      if (!arr) return;
      for (var k = 0; k < arr.length; k++) {
        var p = arr[k];
        var o = prev + (p.o || 0) * unit;
        var c = prev + (p.c || 0) * unit;
        var hh = prev + (p.h == null ? Math.max(p.o || 0, p.c || 0) : p.h) * unit;
        var ll = prev + (p.l == null ? Math.min(p.o || 0, p.c || 0) : p.l) * unit;
        hh = Math.max(hh, o, c);
        ll = Math.min(ll, o, c);
        var v = volBase * (p.v == null ? 1 : p.v);
        out.push({ o: o, h: hh, l: ll, c: c, v: v, base: false });

  /* ---------- 라인 값 해석 ----------
     value: 숫자(가격) | 'minLow:a-b' | 'maxHigh:a-b' | 'fib.382:a-b' | 'close:a' | 'open:a'
  */
  function resolveValue(v, cs) {

    var kind, a, b, seg;
    if (m) {

      seg = cs.slice(a, b + 1);
    } else {
      var m2 = /^([a-zA-Z.0-9]+):(\d+)$/.exec(v);
      if (!m2) return null;
      kind = m2[1]; a = b = +m2[2];
      seg = [cs[a]];
    }
    if (!seg.length) return null;
    var lo = Math.min.apply(null, seg.map(function (x) { return x.l; }));
    var hi = Math.max.apply(null, seg.map(function (x) { return x.h; }));

    if (kind === 'maxHigh') return hi;
    if (kind === 'close') return cs[a].c;
    if (kind === 'open') return cs[a].o;

    }

    return null;
  }

    var plotW = PR - PL;
    var slots = cs.length;
    var slotW = plotW / slots;

    // ---- 해석된 라인 ----
    var lines = (spec.lines || []).map(function (L) {
      var val = resolveValue(L.value, cs);
      return val == null ? null : { y: val, from: L.from == null ? 0 : L.from, to: L.to == null ? slots - 1 : L.to, role: L.role || 'res', label: L.label || '', color: L.color || null, dash: L.dash };
    }).filter(Boolean);

    // ---- 가격 스케일(보이는 캔들 + 라인) ----

    for (var i = 0; i < vis; i++) { if (cs[i].l < lo) lo = cs[i].l; if (cs[i].h > hi) hi = cs[i].h; }

    function y(p) { return PB - (p - lo) / (hi - lo) * (PB - PT); }

    var vMax = 0;
    for (var j = 0; j < vis; j++) { if (cs[j].v > vMax) vMax = cs[j].v; }

    for (var k = 0; k < vis; k++) vAvg += cs[k].v;
    vAvg = vAvg / Math.max(1, vis);
    function vy(v) { return VB - Math.min(1, v / (vMax * 1.02)) * (VB - VT); }

    function cx(idx) { return PL + slotW * (idx + 0.5); }
    var bw = Math.max(2.6, Math.min(9, slotW * 0.62));

    var G = 'rgba(255,255,255,.055)';
    var TXT = '#7d8da6';
    var out = [];
    out.push('<svg viewBox="0 0 ' + W + ' 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' +
      esc(opts.aria || '캔들 차트') + '" preserveAspectRatio="xMidYMid meet">');
    out.push('<defs>' +
      '<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc8a" stop-opacity=".22"/><stop offset="1" stop-color="#f7dc8a" stop-opacity="0"/></linearGradient>' +
      '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      '</defs>');

    // 배경
    out.push('<rect x="0" y="0" width="' + W + '" height="264" fill="#0a1524"/>');

    // 그리드 + 가격축
    var steps = 4;
    for (var g = 0; g <= steps; g++) {
      var yy = PT + (PB - PT) * g / steps;
      var pv = hi - (hi - lo) * g / steps;
      out.push('<line x1="' + PL + '" y1="' + num(yy, 1) + '" x2="' + PR + '" y2="' + num(yy, 1) + '" stroke="' + G + '" stroke-width="1"/>');
      out.push('<text x="' + (PR + 4) + '" y="' + num(yy + 3, 1) + '" fill="' + TXT + '" font-size="8.5" font-weight="700" font-family="system-ui,sans-serif">' + fmt(pv) + '</text>');
    }
    // 거래량 영역 구분선
    out.push('<line x1="' + PL + '" y1="' + (VT - 8) + '" x2="' + PR + '" y2="' + (VT - 8) + '" stroke="rgba(255,255,255,.09)" stroke-width="1"/>');

    // 지지/저항/피보나치 라인
    lines.forEach(function (L, li) {
      var y1 = num(y(L.y), 1);
      var x1 = PL + slotW * L.from + 1, x2 = PL + slotW * (L.to + 1) - 1;
      var col = L.color || (L.role === 'support' ? '#34d399' : L.role === 'resistance' ? '#fb7185' : L.role === 'fib' ? 'rgba(148,163,184,.75)' : '#94a3b8');
      var dash = L.dash || (L.role === 'fib' ? '2 4' : '5 4');
      out.push('<line x1="' + num(x1, 1) + '" y1="' + y1 + '" x2="' + num(x2, 1) + '" y2="' + y1 + '" stroke="' + col + '" stroke-width="1.1" stroke-dasharray="' + dash + '" opacity=".9"/>');
      if (L.label) {
        var lx = num(x1 + 3, 1);
        out.push('<text x="' + lx + '" y="' + num(L.y ? y(L.y) - 4 : 0, 1) + '" text-anchor="start" fill="' + col + '" stroke="#0a1524" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round" font-size="8" font-weight="800" font-family="system-ui,sans-serif">' + esc(L.label) + '</text>');
      }
    });

    // 이동평균선
    (spec.ma || []).forEach(function (period, mi) {
      var col = maColor(period, mi);
      var pts = [];
      for (var q = 0; q < vis; q++) {
        if (q < period - 1) continue;
        var sum = 0;
        for (var z = 0; z < period; z++) sum += cs[q - z].c;
        pts.push(num(cx(q), 1) + ',' + num(y(sum / period), 1));
      }
      if (pts.length > 1) {
        out.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>');
      }
    });

    // 평균 거래량선
    if (spec.avgVol !== false) {
      out.push('<line x1="' + PL + '" y1="' + num(vy(vAvg), 1) + '" x2="' + PR + '" y2="' + num(vy(vAvg), 1) + '" stroke="rgba(247,220,138,.45)" stroke-width="1" stroke-dasharray="3 4"/>');
    }

    // 캔들 + 거래량 (보이는 구간)
    for (var c1 = 0; c1 < vis; c1++) out.push(candleSVG(cs[c1], c1, cx, y, vy, bw, false));

    // ? 자리 / 공개 캔들
    for (var c2 = vis; c2 < slots; c2++) {
      if (!reveal) {
        var bx = cx(c2) - Math.max(7, bw) / 2 - 1.5;
        var bwid = Math.max(14, bw + 3);
        var byc = (PT + PB) / 2;
        out.push('<rect x="' + num(bx, 1) + '" y="' + num(byc - 25, 1) + '" width="' + num(bwid, 1) + '" height="50" rx="6" fill="rgba(224,182,74,.07)" stroke="rgba(224,182,74,.6)" stroke-width="1.2" stroke-dasharray="4 3"/>');
        out.push('<text x="' + num(cx(c2), 1) + '" y="' + num(byc + 7, 1) + '" text-anchor="middle" fill="#f7dc8a" font-size="17" font-weight="900" font-family="system-ui,sans-serif">?</text>');
      } else {
        out.push(candleSVG(cs[c2], c2, cx, y, vy, bw, true));
      }
    }

    // 마커 (파동 번호 등)
    (spec.markers || []).forEach(function (M) {
      var xm = cx(M.i), ym = M.pos === 'below' ? y(cs[M.i].l) + 12 : y(cs[M.i].h) - 12;
      out.push('<circle cx="' + num(xm, 1) + '" cy="' + num(ym, 1) + '" r="7.5" fill="#0b1526" stroke="' + (M.color || '#e0b64a') + '" stroke-width="1.3"/>');
      out.push('<text x="' + num(xm, 1) + '" y="' + num(ym + 3.4, 1) + '" text-anchor="middle" fill="' + (M.color || '#f7dc8a') + '" font-size="9" font-weight="900" font-family="system-ui,sans-serif">' + esc(M.text) + '</text>');
    });

    // 강조 링
    if (hiIdx >= 0 && hiIdx < cs.length) {
      var hc = cs[hiIdx], hx = cx(hiIdx);
      var ty = num(y(hc.h) - 5, 1), ly = num(y(hc.l) + 5, 1);
      out.push('<rect x="' + num(hx - bw / 2 - 3.5, 1) + '" y="' + ty + '" width="' + num(bw + 7, 1) + '" height="' + num(Math.max(6, ly - ty), 1) + '" rx="4" fill="none" stroke="#f7dc8a" stroke-width="1.6" stroke-dasharray="4 2.5" filter="url(#glow)"/>');
    }

    // 하단 라벨 칩 (차트를 가리지 않도록 거래량 아래 띠에 배치)
    if (opts.label) {
      var tw = Math.min(W - 12, opts.label.length * 9.8 + 18);
      out.push('<rect x="6" y="247.5" width="' + num(tw, 1) + '" height="13" rx="6.5" fill="rgba(224,182,74,.18)" stroke="rgba(224,182,74,.55)" stroke-width="1"/>');
      out.push('<text x="' + num(6 + tw / 2, 1) + '" y="257.2" text-anchor="middle" fill="#f7dc8a" font-size="9" font-weight="900" font-family="system-ui,sans-serif">' + esc(opts.label) + '</text>');
    }

    out.push('</svg>');
    return out.join('');
  }

  function maColor(period, i) {
    if (period <= 5) return '#e0b64a';
    if (period <= 20) return '#38bdf8';
    return '#a78bfa';
  }

  function candleSVG(c, idx, cx, y, vy, bw, anim) {
    var x = cx(idx);
    var bull = c.c >= c.o;
    var col = bull ? '#e11d48' : '#2563eb';
    var top = y(Math.max(c.o, c.c)), bot = y(Math.min(c.o, c.c));
    var hgt = Math.max(1.2, bot - top);
    var s = [];
    s.push('<g' + (anim ? ' class="rv" style="animation-delay:' + (idx % 4) * 60 + 'ms"' : '') + '>');
    // 꼬리
    s.push('<line x1="' + num(x, 1) + '" y1="' + num(y(c.h), 1) + '" x2="' + num(x, 1) + '" y2="' + num(y(c.l), 1) + '" stroke="' + col + '" stroke-width="1.3" stroke-linecap="round"/>');
    // 몸통
    s.push('<rect x="' + num(x - bw / 2, 1) + '" y="' + num(top, 1) + '" width="' + num(bw, 1) + '" height="' + num(hgt, 1) + '" rx="' + (bw > 6 ? 1.2 : 0.6) + '" fill="' + col + '"/>');
    // 거래량
    var vTop = vy(c.v), vH = 246 - vTop;
    s.push('<rect x="' + num(x - bw / 2, 1) + '" y="' + num(vTop, 1) + '" width="' + num(bw, 1) + '" height="' + num(Math.max(0.8, vH), 1) + '" rx="0.8" fill="' + col + '" opacity=".55"/>');
    s.push('</g>');
    return s.join('');
  }

  /* ---------- 저장소 ---------- */
  var KEY = 'candleMaster.v1';
  var store = load();
  function load() {
    var base = { best: {}, plays: {}, wrong: { beginner: [], intermediate: [], advanced: [] } };
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return base;
      var o = JSON.parse(raw);
      base.best = o.best || {};
      base.plays = o.plays || {};
      base.wrong = o.wrong || { beginner: [], intermediate: [], advanced: [] };
      ['beginner', 'intermediate', 'advanced'].forEach(function (k) { base.wrong[k] = base.wrong[k] || []; });
      return base;
    } catch (e) { return base; }
  }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  /* ---------- 앱 상태 ---------- */
  var LEVELS = [
    { key: 'beginner', cls: 'b', name: '초급', sub: '캔들·거래량·지지저항' },
    { key: 'intermediate', cls: 'i', name: '중급', sub: '기준봉·눌림목·5패턴' },
    { key: 'advanced', cls: 'a', name: '상급', sub: '파동·확률·실전판단' }
  ];
  var app = {
    tab: 'quiz', level: 'beginner', queue: [], idx: 0,
    answered: false, picked: -1, correct: 0, points: 0, streak: 0, bestStreak: 0,
    mode: 'normal', filter: 'all', view: 'play'
  };

  function levelInfo(k) { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].key === k) return LEVELS[i]; return LEVELS[0]; }
  function qById(id) {
    var all = D.questions;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  function startRound(levelKey) {
    app.level = levelKey; app.mode = 'normal';
    app.queue = D.questions.filter(function (q) { return q.level === levelKey; });
    resetRound();
  }
  function startReview(ids) {
    app.mode = 'review';
    app.queue = ids.map(qById).filter(Boolean);
    if (!app.queue.length) return false;
    resetRound();
    return true;
  }
  function resetRound() {
    app.idx = 0; app.answered = false; app.picked = -1;
    app.correct = 0; app.points = 0; app.streak = 0; app.bestStreak = 0; app.view = 'play';
  }

  /* ---------- 렌더: 퀴즈 ---------- */
  function renderQuiz() {
    var v = $('#view-quiz');
    if (app.view === 'result') return;      // 결과 화면은 finish 화면이 직접 그린다
    if (!app.queue.length) startRound(app.level);
    var q = app.queue[app.idx];
    if (!q) return finish();

    var lv = levelInfo(app.level);
    var total = app.queue.length;
    var pct = Math.round((app.idx) / total * 100);

    var chips = LEVELS.map(function (L) {
      var on = (L.key === app.level && app.mode === 'normal') ? '1' : '0';
      return '<button class="lv ' + L.cls + '" data-lv="' + L.key + '" data-on="' + on + '" type="button">' +
        L.name + '<span>' + L.sub + '</span></button>';
    }).join('');

    var html = '';
    html += '<div class="levels">' + chips + '</div>';
    html += '<div class="hud">' +
      '<span class="num">문제 ' + (app.idx + 1) + ' / ' + total + '</span>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<span class="pt">' + app.points + '점</span></div>';

    html += '<div class="card">';
    html += '<div class="qhead">' +
      '<span class="qtag">' + esc(q.tag) + '</span>' +
      '<h2 class="qtitle">' + esc(q.title) + '</h2>' +
      (q.sub ? '<p class="qsub">' + esc(q.sub) + '</p>' : '') +
      '</div>';
    html += '<div class="chartwrap">' + renderChart(q.chart, { reveal: false, label: q.chartTag || '', aria: q.title }) + '</div>';
    html += '<div class="legend">' +
      '<b><i class="sw bull"></i>양봉</b><b><i class="sw bear"></i>음봉</b>' +
      ((q.chart.ma && q.chart.ma.length) ? '<b><i class="sw ma"></i>' + q.chart.ma.map(function (p) { return p + '일선'; }).join('/') + '</b>' : '') +
      '<b>↕ 아래 막대 = 거래량</b></div>';
    html += '<div class="opts">';
    q.options.forEach(function (o, i) {
      html += '<button class="opt" data-i="' + i + '" type="button"><span class="k">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>';
    });
    html += '</div>';
    html += '</div>';   // card

    v.innerHTML = html;
    v.className = 'screen';
    app.picked = -1; app.answered = false;
  }

  function pick(i) {
    if (app.answered) return;
    var q = app.queue[app.idx];
    if (!q) return;
    app.answered = true; app.picked = i;
    var ok = (i === q.answer);
    if (ok) {
      app.correct++; app.streak++;
      if (app.streak > app.bestStreak) app.bestStreak = app.streak;
      app.points += 10 + (app.streak >= 3 ? 5 : 0);
      if (app.mode === 'review') removeWrong(q.level, q.id);
    } else {
      app.streak = 0;
      if (store.wrong[q.level].indexOf(q.id) < 0) store.wrong[q.level].push(q.id);
    }
    save();

    // 옵션 표시
    $$('#view-quiz .opt').forEach(function (b) {
      var bi = +b.getAttribute('data-i');
      b.disabled = true;
      if (bi === q.answer) b.classList.add('ok');
      else if (bi === i) b.classList.add('no');
      else b.classList.add('dim');
    });

    // 차트 공개
    var wrap = $('#view-quiz .chartwrap');
    if (wrap) {
      wrap.innerHTML = renderChart(q.chart, {
        reveal: true,
        label: q.revealLabel || '',
        highlight: hlIndex(q),
        aria: q.title
      });
    }

    // 해설
    var exp = document.createElement('div');
    exp.className = 'exp';
    exp.innerHTML =
      '<div class="top-line"><span class="verdict">' + (ok ? '✅' : '❌') + '</span>' +
      '<span class="ans">' + (ok ? '정답! ' : '아쉬워요 · 정답은 ') + '“' + esc(q.options[q.answer]) + '”</span></div>' +
      '<div class="body">' + q.why + '</div>' +
      '<div class="keyline">💡 ' + q.key + '</div>' +
      '<div style="padding:0 .8rem .7rem"><span class="rulechip">' + esc(q.rule) + '</span></div>';
    $('.card').appendChild(exp);
    app.expNode = exp;

    // 콤보
    if (app.streak >= 3) showCombo(app.streak);

    // 다음 버튼
    var btn = document.createElement('button');
    btn.className = 'nextbtn';
    btn.type = 'button';
    btn.id = 'nextBtn';
    btn.textContent = (app.idx === app.queue.length - 1) ? '결과 보기 →' : '다음 문제 →';
    btn.addEventListener('click', next);
    $('.card').appendChild(btn);

    setTimeout(function () {
      try {
        var hd = $('.top');
        var hh = hd ? hd.offsetHeight : 100;
        var cw = $('#view-quiz .chartwrap');
        if (!cw) return;
        var y = cw.getBoundingClientRect().top + (window.pageYOffset || 0) - hh - 8;
        if (y < 0) y = 0;
        window.scrollTo({ top: y, behavior: 'smooth' });
      } catch (err) { /* jsdom 등 */ }
    }, 80);
  }

  function showCombo(n) {
    var c = $('#combo');
    c.textContent = '🔥 ' + n + '연속 정답!' + (n >= 5 ? ' 미쳤다!' : '');
    c.classList.add('on');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(function () { c.classList.remove('on'); }, 1600);
  }

  // 강조할 캔들: 마지막 보이는 캔들에서 hlBack 만큼 뒤
  function hlIndex(q) {
    if (q.hlBack == null) return -1;
    var s = q.chart.__s || (q.chart.__s = buildSeries(q.chart));
    var i = s.visibleCount - 1 - q.hlBack;
    return i >= 0 ? i : -1;
  }
  function removeWrong(level, id) {
    var a = store.wrong[level] || [];
    var i = a.indexOf(id);
    if (i >= 0) a.splice(i, 1);
  }

  function next() {
    app.idx++;
    if (app.idx >= app.queue.length) return finish();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(function () { window.scrollTo(0, 0); }, 10);
  }

  /* ---------- 결과 ---------- */
  function finish() {
    var total = app.queue.length;
    var pct = total ? Math.round(app.correct / total * 100) : 0;
    var medal, title, desc;
    if (pct >= 90) { medal = '🏆'; title = '캔들 마스터'; desc = '차트를 규칙으로 읽는 눈이 완성됐어요.'; }
    else if (pct >= 75) { medal = '🥇'; title = '차트 읽는 눈'; desc = '실전에서 충분히 통하는 수준이에요.'; }
    else if (pct >= 55) { medal = '🥈'; title = '기본기 완성'; desc = '한 번 더 돌리면 확실히 잡혀요.'; }
    else { medal = '🌱'; title = '복습이 필요해요'; desc = '해설을 읽고 오답만 다시 풀어봐요.'; }

    if (app.mode === 'normal') {
      var lvKey = app.level;
      var prevBest = store.best[lvKey] == null ? -1 : store.best[lvKey];
      if (app.points > prevBest) {
        store.best[lvKey] = app.points;
        if (prevBest >= 0) desc = '🎉 최고 점수 경신! ' + desc;
        else desc = '첫 기록! ' + desc;
      }
      store.plays[lvKey] = (store.plays[lvKey] || 0) + 1;
      save();
    }

    var v = $('#view-quiz');
    var wrongCount = store.wrong[app.level] ? store.wrong[app.level].length : 0;

    var html = '<div class="card result">' +
      '<div class="medal">' + medal + '</div>' +
      '<h3>' + title + '</h3>' +
      '<p class="sub">' + esc(desc) + '</p>' +
      '<div class="scorebox">' +
      '<div class="stat"><b>' + app.correct + '/' + total + '</b><span>맞힌 문제</span></div>' +
      '<div class="stat"><b>' + pct + '%</b><span>정답률</span></div>' +
      '<div class="stat"><b>' + app.points + '</b><span>획득 점수</span></div>' +
      '<div class="stat"><b>' + app.bestStreak + '</b><span>최고 콤보</span></div>' +
      '</div>';

    if (app.mode === 'normal' && wrongCount > 0) {
      html += '<div class="wronglist"><div class="h">📌 이 단계에서 아직 틀린 문제 ' + wrongCount + '개</div><ul>' +
        store.wrong[app.level].map(function (id) {
          var q = qById(id);
          return q ? '<li><i>✕</i><span>' + esc(q.tag) + ' · ' + esc(q.title) + '</span></li>' : '';
        }).join('') + '</ul></div>';
    }
    if (app.mode === 'review' && wrongCount > 0) {
      html += '<div class="wronglist"><div class="h">📌 남은 오답 ' + wrongCount + '개 · 한 번 더 돌려봐요</div></div>';
    }

    html += '<div class="btns">';
    if (app.mode === 'normal') {
      var wl = store.wrong[app.level] || [];
      if (wl.length) html += '<button class="btn" id="reviewBtn" type="button">🔁 오답만 다시 풀기 (' + wl.length + ')</button>';
      html += '<button class="btn ghost" id="againBtn" type="button">↺ ' + levelInfo(app.level).name + ' 다시 도전</button>';
      html += '<button class="btn ghost" id="bookBtn" type="button">📖 패턴 도감 보기</button>';
    } else {
      var allWrong = [].concat(store.wrong.beginner, store.wrong.intermediate, store.wrong.advanced);
      if (allWrong.length) html += '<button class="btn" id="reviewBtn" type="button">🔁 남은 오답 다시 풀기 (' + allWrong.length + ')</button>';
      html += '<button class="btn ghost" id="bookBtn" type="button">📖 패턴 도감 보기</button>';
      html += '<button class="btn ghost" id="homeBtn" type="button">🏠 단계 선택으로</button>';
    }
    html += '</div></div>';

    v.innerHTML = html;

    var rb = $('#reviewBtn');
    if (rb) rb.addEventListener('click', function () {
      var ids = app.mode === 'normal' ? store.wrong[app.level].slice()
        : [].concat(store.wrong.beginner, store.wrong.intermediate, store.wrong.advanced);
      if (startReview(ids)) renderQuiz();
    });
    var ab = $('#againBtn');
    if (ab) ab.addEventListener('click', function () { startRound(app.level); renderQuiz(); });
    var bb = $('#bookBtn');
    if (bb) bb.addEventListener('click', function () { switchTab('book'); });
    var hb = $('#homeBtn');
    if (hb) hb.addEventListener('click', function () { startRound(app.level); renderQuiz(); });
    app.view = 'result';
  }

  /* ---------- 도감 ---------- */
  function renderBook() {
    var v = $('#view-book');
    var pats = D.patterns.map(function (p, i) {
      return '<div class="pat">' +
        '<div class="hd"><span class="no">' + (i + 1) + '</span><h4>' + esc(p.name) + '</h4>' +
        '<span class="badge ' + p.badgeCls + '">' + esc(p.badge) + '</span></div>' +
        '<div class="mini">' + renderChart(p.chart, { reveal: true, label: p.miniLabel || '', highlight: hlIndex(p), aria: p.name }) + '</div>' +
        '<div class="tx">' + p.body + '<span class="say">👉 ' + p.act + '</span></div>' +
        '</div>';
    }).join('');

    var f = app.filter;
    var rules = D.rules.filter(function (r) { return f === 'all' || r.lv === f; });
    var ruleHtml = rules.map(function (r) {
      return '<div class="rule"><span class="n">#' + r.n + '</span><div class="c"><div class="t">' + esc(r.t) + '</div><div class="d">' + esc(r.d) + '</div></div><span class="lv ' + r.lv + '">' + (r.lv === 'b' ? '초급' : r.lv === 'i' ? '중급' : '상급') + '</span></div>';
    }).join('');

    v.innerHTML =
      '<h2 class="sec">🕯️ 장대양봉 뒤 음봉 <span class="n">5가지 패턴</span></h2>' +
      '<div class="patlist">' + pats + '</div>' +
      '<h2 class="sec">📖 핸드북 규칙 요약 <span class="n">#1~#89 · ' + D.rules.length + '개</span></h2>' +
      '<div class="filters">' +
      ['all', 'b', 'i', 'a'].map(function (k) {
        var nm = k === 'all' ? '전체' : k === 'b' ? '🟢 초급' : k === 'i' ? '🟡 중급' : '🔴 상급';
        return '<button class="fchip" data-f="' + k + '" data-on="' + (app.filter === k ? '1' : '0') + '" type="button">' + nm + '</button>';
      }).join('') + '</div>' +
      '<div class="rules">' + ruleHtml + '</div>' +
      '<div class="tipbox">책 제목은 《87선》이지만 본문은 #89까지 이어집니다. 규칙 번호(#)는 원문 표기를 그대로 따랐어요.</div>';
  }

  /* ---------- 기록 ---------- */
  function renderStats() {
    var v = $('#view-stats');
    var rows = LEVELS.map(function (L) {
      var best = store.best[L.key];
      var plays = store.plays[L.key] || 0;
      var wrong = (store.wrong[L.key] || []).length;
      var tot = D.questions.filter(function (q) { return q.level === L.key; }).length;
      return '<div class="recrow"><span class="ic ' + L.cls + '">' +
        (L.key === 'beginner' ? '🟢' : L.key === 'intermediate' ? '🟡' : '🔴') + '</span>' +
        '<span class="nm">' + L.name + ' <small>도전 ' + plays + '회 · 오답 ' + wrong + '/' + tot + '</small></span>' +
        '<span class="sc">' + (best == null ? '—' : best + '<em>점</em>') + '</span></div>';
    }).join('');

    var allWrong = [].concat(store.wrong.beginner, store.wrong.intermediate, store.wrong.advanced);
    var totalQ = D.questions.length;

    v.innerHTML =
      '<h2 class="sec">🏆 내 실력</h2>' +
      '<div class="card" style="padding:.6rem"><div class="rec">' + rows + '</div></div>' +
      '<h2 class="sec">🔁 오답 복습</h2>' +
      '<div class="card" style="padding:.7rem">' +
      '<div style="font-size:.84rem;color:#cfd9ea;line-height:1.6">지금까지 틀린 문제 <b style="color:#f7dc8a">' + allWrong.length + '개</b> / 전체 ' + totalQ + '문제</div>' +
      '<div class="btns" style="margin-top:.6rem">' +
      (allWrong.length ? '<button class="btn" id="revAll" type="button">🔁 오답 ' + allWrong.length + '문제 다시 풀기</button>' : '<button class="btn ghost" type="button" disabled>오답이 없어요 👏</button>') +
      '</div></div>' +
      '<h2 class="sec">⚙️ 기록 관리</h2>' +
      '<div class="card" style="padding:.7rem"><div class="btns">' +
      '<button class="btn ghost" id="resetBtn" type="button">기록 초기화</button></div></div>' +
      '<div class="tipbox">점수는 문제당 10점, 3연속 정답부터 문제당 +5점 보너스가 붙어요. 단계별 최고 점수는 이 기기에 저장됩니다.</div>';

    var r = $('#revAll');
    if (r) r.addEventListener('click', function () {
      if (startReview(allWrong)) { switchTab('quiz'); }
    });
    var rs = $('#resetBtn');
    if (rs) rs.addEventListener('click', function () {
      var ok = true;
      try { ok = window.confirm('점수와 오답 기록을 모두 지울까요?'); } catch (e) { ok = true; }
      if (!ok) return;
      store = { best: {}, plays: {}, wrong: { beginner: [], intermediate: [], advanced: [] } };
      save(); renderStats();
    });
  }

  /* ---------- 탭 ---------- */
  function switchTab(tab) {
    app.tab = tab;
    $$('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false'); });
    ['quiz', 'book', 'stats'].forEach(function (k) {
      var el = $('#view-' + k);
      if (el) el.hidden = (k !== tab);
    });
    if (tab === 'quiz') { if (app.view !== 'result') renderQuiz(); }
    if (tab === 'book') renderBook();
    if (tab === 'stats') renderStats();
    window.scrollTo(0, 0);
  }

  /* ---------- 이벤트 ---------- */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-tab],[data-lv],[data-i],[data-f]') : null;
      if (!t) return;
      if (t.hasAttribute('data-tab')) { switchTab(t.getAttribute('data-tab')); return; }
      if (t.hasAttribute('data-lv')) {
        var lk = t.getAttribute('data-lv');
        // 진행 중인 같은 단계를 다시 누르면 판을 새로 시작하지 않는다
        if (lk === app.level && app.mode === 'normal' && app.view === 'play' && app.idx > 0) return;
        app.mode = 'normal';
        startRound(lk);
        app.view = 'play';
        renderQuiz();
        return;
      }
      if (t.hasAttribute('data-f')) {
        app.filter = t.getAttribute('data-f');
        renderBook();
        return;
      }
      if (t.hasAttribute('data-i')) {
        pick(+t.getAttribute('data-i'));
      }
    });

    var fs = $('#fsBtn');
    if (fs) fs.addEventListener('click', function () {
      var big = document.documentElement.classList.toggle('big');
      fs.textContent = big ? '가-' : '가+';
      try { window.localStorage.setItem(KEY + '.fs', big ? '1' : '0'); } catch (e) {}
    });

    document.addEventListener('keydown', function (e) {
      if (app.tab !== 'quiz') return;
      if (/^[1-4]$/.test(e.key)) {
        var b = $('.opt[data-i="' + (+e.key - 1) + '"]');
        if (b && !app.answered) pick(+e.key - 1);
      } else if (e.key === 'Enter' || e.key === ' ') {
        var nb = $('#nextBtn');
        if (nb) { e.preventDefault(); next(); }
      }
    });
  }

  /* ---------- 부트 ---------- */
  function boot() {
    try {
      if (window.localStorage.getItem(KEY + '.fs') === '1') {
        document.documentElement.classList.add('big');
        var fs = $('#fsBtn'); if (fs) fs.textContent = '가-';
      }
    } catch (e) {}
    bind();
    startRound('beginner');
    switchTab('quiz');
  }

  // 테스트/디버그용 노출
  window.__CM = {
    buildSeries: buildSeries, renderChart: renderChart, resolveValue: resolveValue,
    get app() { return app; }, store: function () { return store; },
    startRound: startRound, startReview: startReview, renderQuiz: renderQuiz,
    switchTab: switchTab, pick: pick, next: next, finish: finish,
    renderBook: renderBook, renderStats: renderStats, data: D
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
